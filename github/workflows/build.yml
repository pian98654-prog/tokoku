name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Susun folder proyek
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/toko/app mv index.html app/src/main/assets/ mv MainActivity.java app/src/main/java/com/toko/app/ mv AndroidManifest.xml app/src/main/ mv app-build.gradle app/build.gradle - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TokoApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
