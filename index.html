<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#000;color:#fff;font-family:sans-serif;padding-bottom:70px}
.top{display:flex;gap:12px;align-items:center;padding:14px 16px}
.search{flex:1;background:#1c1c1e;border-radius:14px;padding:12px 14px;display:flex;gap:8px;color:#888}
.search input{background:none;border:0;outline:0;color:#fff;font-size:16px;width:100%}
.tabs{display:flex;gap:24px;padding:6px 20px;font-size:18px;color:#999;overflow-x:auto}
.tabs span{padding-bottom:6px;white-space:nowrap}
.tabs .on{color:#2f7bff;font-weight:bold;border-bottom:3px solid #2f7bff}
.banner{margin:14px 16px;height:150px;border-radius:18px;background:linear-gradient(135deg,#b3202a,#f2a65a);padding:20px;font-size:28px;font-weight:bold;font-style:italic;display:flex;align-items:center}
h2{font-size:21px;margin:22px 16px 10px}
.row{display:flex;gap:14px;overflow-x:auto;padding:0 16px}
.app{width:92px;flex:none;text-align:center}
.ic{width:84px;height:84px;border-radius:20px;margin:auto;display:flex;align-items:center;justify-content:center;font-size:40px}
.nm{font-size:14px;margin:8px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sz{font-size:12px;color:#888}
.btn{margin-top:8px;border:0;background:#12233f;color:#2f7bff;font-weight:bold;border-radius:18px;padding:8px 0;width:100%;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;height:62px;background:#111;display:flex}
nav div{flex:1;text-align:center;font-size:11px;color:#888;padding-top:8px}
nav div i{display:block;font-style:normal;font-size:22px}
nav .on{color:#2f7bff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 12px}
.grid .app{width:auto}
.form{margin:0 16px;display:flex;flex-direction:column;gap:10px}
.form input,.form select{background:#1c1c1e;border:0;border-radius:12px;color:#fff;padding:13px;font-size:15px}
.form button{background:#2f7bff;color:#fff;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:bold}
.hint{padding:0 16px;color:#888;font-size:14px;line-height:1.4}
.del{color:#ff6b6b;font-size:12px;margin-top:6px}
</style></head><body>
<div class="top"><span style="font-size:28px">🎮</span>
<div class="search">🔍<input id="q" placeholder="Cari aplikasi..." oninput="render()"></div></div>
<div id="main"></div>
<nav id="nav"></nav>
<script>
const P=(n,e,c,k,cat,hot)=>({n:n,e:e,c:c,k:k,u:"https://play.google.com/store/apps/details?id="+k,cat:cat,p:1,hot:hot});
const DIRECT=[
{hot:1,n:"WhatsApp",e:"💬",c:"#25d366",u:"https://www.whatsapp.com/android/current/WhatsApp.apk",cat:"app",p:1},
{hot:1,n:"Telegram",e:"✈️",c:"#2aabee",u:"https://telegram.org/dl/android/apk",cat:"app",p:1},
{n:"F-Droid",e:"📦",c:"#1976d2",u:"https://f-droid.org/F-Droid.apk",cat:"app",p:1}];
const BASE=DIRECT.concat([
P("TikTok","🎵","#161616","com.zhiliaoapp.musically","app",1),
P("TikTok Lite","🎶","#222","com.tiktok.lite.go","app",0),
P("Instagram","📷","#c13584","com.instagram.android","app",1),
P("YouTube","▶️","#e03131","com.google.android.youtube","app",1),
P("Facebook","👍","#1877f2","com.facebook.katana","app",0),
P("Spotify","🎧","#1db954","com.spotify.music","app",0),
P("Shopee","🛒","#ee4d2d","com.shopee.id","app",0),
P("Gojek","🛵","#00aa13","com.gojek.app","app",0),
P("Free Fire","🔥","#f5a623","com.dts.freefireth","game",1),
P("Free Fire MAX","💥","#e8590c","com.dts.freefiremax","game",1),
P("Mobile Legends","⚔️","#1c4e9a","com.mobile.legends","game",1),
P("PUBG Mobile","🎯","#8a6d3b","com.tencent.ig","game",0),
P("Roblox","🧱","#c92a2a","com.roblox.client","game",0),
P("Minecraft","⛏️","#4c9a2a","com.mojang.minecraftpe","game",0),
P("Genshin Impact","✨","#3b5bdb","com.miHoYo.GenshinImpact","game",0)]);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let fail={},lastErr="";let cus=ld("cus",[]),st=ld("st",{}),prog={},page=0,tab=0,pesan="";
const B=window.AndroidB;
const all=()=>BASE.concat(cus);
const save=()=>{localStorage.setItem("cus",JSON.stringify(cus));localStorage.setItem("st",JSON.stringify(st))};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const T=["Untukmu","Novel","Populer","Anak"];
const N=[["🏠","Beranda"],["🎮","Game"],["⬇️","Unduhan"],["🛍️","Aplikasi"],["👤","Saya"]];
function label(u){if(u.indexOf("https://play.google.com/")==0)return"Play Store";if(fail[u])return"Browser";const s=st[u];if(!s)return"Mendapatkan";if(s.done)return"Pasang";return prog[u]||"Memulai"}
function upd(){document.querySelectorAll("[data-u]").forEach(b=>b.textContent=label(b.dataset.u))}
const DOM={"WhatsApp":"whatsapp.com","Telegram":"telegram.org","F-Droid":"f-droid.org","TikTok":"tiktok.com","TikTok Lite":"tiktok.com","Instagram":"instagram.com","YouTube":"youtube.com","Facebook":"facebook.com","Spotify":"spotify.com","Shopee":"shopee.co.id","Gojek":"gojek.com","Free Fire":"ff.garena.com","Free Fire MAX":"ff.garena.com","Mobile Legends":"mobilelegends.com","PUBG Mobile":"pubgmobile.com","Roblox":"roblox.com","Minecraft":"minecraft.net","Genshin Impact":"genshin.hoyoverse.com"};
function ic(a){const d=DOM[a.n];
if(!d||a.cus)return `<div class="ic" style="background:${a.c}">${a.e}</div>`;
return `<div class="ic" style="background:#1c1c1e;overflow:hidden"><img style="width:100%;height:100%" src="https://www.google.com/s2/favicons?domain=${d}&sz=128" data-e="${a.e}" onerror="var p=this.parentNode;p.style.background='${a.c}';p.textContent=this.dataset.e"></div>`}
function card(a,i){return `<div class="app">${ic(a)}<div class="nm">${esc(a.n)}</div><div class="sz">${a.k?"Play Store":a.p?"Resmi":"Tambahan"}</div><button class="btn" data-u="${esc(a.u)}" onclick="get(${i})">${label(a.u)}</button></div>`}
function get(i){const a=all()[i],s=st[a.u];
if(a.k){if(B)B.openUrl(a.u);else window.open(a.u);return}
if(fail[a.u]){if(B)B.openUrl(a.u);else window.open(a.u);return}
if(s&&s.done){if(B)B.install(s.id);return}
if(s)return;
if(!B){window.open(a.u);return}
const id=B.download(a.u,a.n);
if(id<0){fail[a.u]=1;lastErr="gagal memulai";upd();return}
st[a.u]={id:id,done:0};prog[a.u]="Memulai";save();upd()}
setInterval(()=>{if(!B)return;let ch=0;
for(const u in st){const s=st[u];if(s.done)continue;
const [x,d,t,r]=String(B.status(s.id)).split("|").map(Number);
if(x==8){s.done=1;ch=1}
else if(x==16||x==0){delete st[u];fail[u]=1;lastErr="kode "+x+"/"+r;ch=1}
else if(x==1)prog[u]="Menunggu";
else if(x==4)prog[u]="Jeda";
else prog[u]=t>0?Math.floor(d*100/t)+"%":(d>0?(d/1048576).toFixed(1)+" MB":"Memulai")}
if(ch)save();upd();
const e=document.getElementById("err");if(e)e.textContent=lastErr?"Unduhan gagal ("+lastErr+"). Tekan tombol Browser untuk mengunduh lewat browser.":""},1000);
function list(f){return all().map((a,i)=>[a,i]).filter(x=>f(x[0]))}
function grid(l,kosong){return l.length?`<div class="grid">${l.map(x=>card(x[0],x[1])).join("")}</div>`:`<p class="hint">${kosong}</p>`}
function addApp(){const n=document.getElementById("an").value.trim(),u=document.getElementById("au").value.trim(),c=document.getElementById("ac").value;
if(!n||!/^https?:\/\//.test(u)){pesan="Isi nama dan tautan APK yang diawali https://";render();return}
cus.push({cus:1,n:n,e:c=="game"?"🎮":"📱",c:"#455a64",u:u,cat:c});pesan="Ditambahkan!";save();render()}
function del(i){cus.splice(i-BASE.length,1);save();render()}
function render(){const q=document.getElementById("q").value.toLowerCase();let h="";
if(q){h=`<h2>Hasil pencarian</h2>`+grid(list(a=>a.n.toLowerCase().includes(q)),"Tidak ditemukan.")}
else if(page==0){
h=`<div class="tabs">${T.map((t,i)=>`<span class="${i==tab?"on":""}" onclick="tab=${i};render()">${t}</span>`).join("")}</div><div class="banner">Toko<br>Aplikasi</div>`
+`<h2>Paling Populer ›</h2><div class="row">${list(a=>a.hot).map(x=>card(x[0],x[1])).join("")}</div>`
+`<h2>Game Seru Terbaru! ›</h2><div class="row">${list(a=>a.p&&a.cat=="game").map(x=>card(x[0],x[1])).join("")}</div>`
+`<h2>Pasti Kamu Suka! ›</h2><div class="row">${list(a=>a.p&&a.cat=="app").map(x=>card(x[0],x[1])).join("")}</div>`
+(cus.length?`<h2>Tambahanmu ›</h2><div class="row">${list(a=>!a.p).map(x=>card(x[0],x[1])).join("")}</div>`:"")
+`<p class="hint" id="err" style="margin-top:16px"></p><p class="hint" style="margin-top:12px">Mau aplikasi lain? Buka tab Saya, lalu tambahkan tautan APK-nya.</p>`}
else if(page==1){h=`<h2>Game</h2>`+grid(list(a=>a.cat=="game"),"Belum ada game. Tambahkan lewat tab Saya.")}
else if(page==2){h=`<h2>Unduhan</h2>`+grid(list(a=>st[a.u]),"Belum ada unduhan.")}
else if(page==3){h=`<h2>Aplikasi</h2>`+grid(list(a=>a.cat=="app"),"Kosong.")}
else{h=`<h2>Tambah aplikasi</h2><div class="form"><input id="an" placeholder="Nama aplikasi"><input id="au" placeholder="Tautan APK (https://...)" inputmode="url"><select id="ac"><option value="app">Aplikasi</option><option value="game">Game</option></select><button onclick="addApp()">Tambah</button><div class="hint" style="padding:0">${pesan}</div></div>`
+(cus.length?`<h2>Tambahanmu</h2>`+`<div class="grid">${cus.map((a,j)=>card(a,j+BASE.length).replace(/<\/div>$/,`<div class="del" onclick="del(${j+BASE.length})">Hapus</div></div>`)).join("")}</div>`:"")}
document.getElementById("main").innerHTML=h;
document.getElementById("nav").innerHTML=N.map((n,i)=>`<div class="${i==page?"on":""}" onclick="page=${i};pesan='';render()"><i>${n[0]}</i>${n[1]}</div>`).join("")}
render();
</script></body></html>
